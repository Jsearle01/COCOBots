<?xml version="1.0"?>
<!--
  MAME machine configuration template for the coco3 live gate.

  The ONLY load-bearing line is the :screen_config port below. Monitor Type on
  MAME's coco3 is a MACHINE CONFIGURATION, not a command-line flag — there is no
  -monitor / -rgb switch (mame-idioms-coco3-port.md 11l). MAME's own default is
  Composite (value 0), and CLAUDE.md 4 gates this project on RGB (value 1).

  This matters in a way no byte-level check can see: the framebuffer holds
  palette INDICES, and Monitor Type only changes how $FFB0-$FFBF are DECODED.
  A run left on the default renders the wrong colours while every automated
  check stays green (idioms 18).

  MAME REWRITES ITS CFG ON EXIT, adding image/mixer/video blocks. run.sh copies
  this file into a scratch directory and points -cfg_directory there, so this
  tracked template is never the file MAME writes back to.
-->
<mameconfig version="10">
    <system name="coco3">
        <input>
            <keyboard tag=":" enabled="1" />
            <port tag=":screen_config" type="CONFIG" mask="1" defvalue="0" value="1" />
        </input>
    </system>
</mameconfig>
